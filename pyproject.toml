[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "img-spec"
version = "1.0.0"
description = "Responsive viewport breakpoint and Largest Contentful Paint (LCP) image auditor"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    # PolyForm Noncommercial 1.0.0
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Multimedia :: Graphics"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "websockets>=12.0"
]

[project.scripts]
img-spec = "img_spec.cli:main"

[project.urls]
"Homepage" = "https://github.com/xcalibur73/img-spec"
"Cloud Engine" = "https://webaudits.pro/tools/img-spec"
"Bug Tracker" = "https://github.com/xcalibur73/img-spec/issues"
